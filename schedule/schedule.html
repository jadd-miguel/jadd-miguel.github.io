<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCHEDULE - MY SITE</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="../styles/general.css">
    <link rel="stylesheet" href="../styles/nav-top.css">
    <link rel="stylesheet" href="../styles/media.css">
    <link rel="stylesheet" href="./schedule.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/snackbar.css">
    <script src="../scripts/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../scripts/server.js" defer></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js'></script>
    <script src="./schedule.js" defer></script>
</head>
<body>
    <nav>
        <ul class="nav-top">
            <li>
                <a href="../index.html">
                    <i class="fa-solid fa-house"></i>
                </a>
            </li>
            <li class="title"></li>
        </ul>
    </nav>
    <div id="snackbar"></div>
    <div class="sched-row">
        <div class="sched-col">
            <div id='calendar'></div>
        </div>
        <div class="sched-col">
            <div class="event-modal">
                <form>
                    <button type="button" onclick="clear_form()">Clear</button>
                    <input type="date" id="event-date">
                    <input type="text" id="event-cat" placeholder="category" autocomplete="off">
                    <input type="text" id="event-info" placeholder="info" autocomplete="off">
                    <input type="checkbox" id="is-done">
                    <label for="is-done">Done</label>
                    <button onclick="event_add()">Add</button>
                </form>
            </div>
            <ul id="event-list"></ul>
        </div>
    </div>
</body>
</html>
