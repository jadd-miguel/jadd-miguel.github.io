<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUDGET - MY SITE</title>
    <link rel="stylesheet" href="../styles/general.css">
    <link rel="stylesheet" href="../styles/nav-top.css">
    <link rel="stylesheet" href="../styles/media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/snackbar.css">
    <link rel="stylesheet" href="./budget.css">
    <script src="https://cdn.plot.ly/plotly-3.4.0.min.js" charset="utf-8"></script>
    <script src="../scripts/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../scripts/server.js" defer></script>
    <script src="./utility.js" defer></script>
    <script src="./plotting.js"></script>
    <script src="./budget.js" defer></script>
</head>
<body>
    <nav>
        <ul class="nav-top">
            <li>
                <a href="../index.html">
                    <i class="fa-solid fa-house"></i>
                </a>
            </li>
            <li class="title"></li>
        </ul>
    </nav>
    <div id="snackbar"></div>
    <div class="for-desktop">
        <div class="budget-row">
            <form id="options">
                <input type="file" id="folderInput" webkitdirectory multiple>
                <button id="toRun">Run Selected</button>
                <button id="toDemo">Run Demo</button>
                <label>By: </label>
                <button type="button" id="byDay" class="active">Day</button>
                <button type="button" id="byMonth">Month</button>
                <label>Range: </label>
                <input type="date" id="start-range">
                <input type="date" id="end-range">
                <button type="button" id="date-reset">Reset Filter</button>
            </form>
        </div>
        <div class="budget-row">
            <form id="select_months"></form>
        </div>
        <div class="budget-row">
            <div id="slope"></div>
            <div id="zero"></div>
            <div id="worth"></div>
        </div>
        <div class="budget-row" id="trend"></div>
        <div class="budget-row">
            <form>
                <label>Amount Per Time Options: </label>
                <button type="button" id="byNet" class="active">Net</button>
                <button type="button" id="byDeduct">Deduct</button>
                <button type="button" id="byCredit">Credit</button>
            </form></div>
        <div class="budget-row" id="data_net"></div>
        <div class="budget-row" id="category"></div>
    </div>
    <div class="for-mobile">
        <h1>Module Unavailable For Mobile</h1>
    </div>
</body>
</html>
